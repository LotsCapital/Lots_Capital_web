<style>
  :root {
    --bg: #1E1E1E;
    --bg-soft: #252525;
    --bg-card: rgba(255,255,255,0.04);
    --line: rgba(255,255,255,0.08);
    --text: #ffffff;
    --muted: rgba(255,255,255,0.55);
    --gold: #CBA052;
    --gold-soft: rgba(203,160,82,0.15);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 400;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;

  h1, h2, h3, h4 { margin:0; font-weight: 700; letter-spacing: -0.01em; }
  p { margin: 0; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }

  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    text-align: center;
  }
  .divider {
    width: 56px; height: 1px;
    background: var(--gold);
    opacity: 0.55;
    margin: 22px auto;
  }
  .container { max-width: 1180px; margin: 0 auto; padding: 0 32px; }

  /* HEADER */
  .header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(30,30,30,0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 80px;
  }
  .brand { display:flex; align-items:center; gap: 12px; }
  .brand-mark { height: 40px; width: 40px; display: block; }
  .brand-word { font-weight: 700; font-size: 16px; letter-spacing: 0.18em; color: var(--text); }
  .brand-word em { font-style: normal; color: var(--gold); font-weight: 700; }
  .nav { display:flex; gap: 36px; }
  .nav a {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); transition: color .2s;
  }
  .nav a:hover { color: var(--gold); }
  .header-right { display:flex; align-items:center; gap: 18px; }
  .lang { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
  .lang strong { color: var(--text); }

  .btn {
    display:inline-flex; align-items:center; justify-content:center;
    padding: 11px 20px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: all .2s;
  }
  .btn-primary {
    background: var(--gold); color: #1a1a1a;
    border-color: var(--gold);
  }
  .btn-primary:hover { background: #d8b269; border-color: #d8b269; }
  .btn-ghost {
    background: transparent; color: var(--text);
    border-color: rgba(255,255,255,0.18);
  }
  .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

  /* HERO */
  .hero {
    position: relative;
    padding: 110px 0 90px;
    text-align: center;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(60% 50% at 50% 35%, rgba(203,160,82,0.08), transparent 60%);
    pointer-events: none;
  }
  .hero-inner { position: relative; z-index: 1; max-width: 920px; margin: 0 auto; padding: 0 32px; }
  .hero h1 {
    font-size: clamp(38px, 6vw, 78px);
    line-height: 1.05;
    margin-top: 28px;
    font-weight: 800;
  }
  .hero h1 .gold { color: var(--gold); }
  .hero p.lead {
    color: var(--muted);
    font-size: 16px;
    max-width: 560px;
    margin: 28px auto 0;
  }
  .hero-ctas {
    margin-top: 40px;
    display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
  }

  /* KPI ROW */
  .kpi-row {
    margin-top: 90px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 36px 0;
  }
  .kpi { text-align: center; }
  .kpi-value {
    font-size: clamp(20px, 2.2vw, 26px);
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .kpi-value.accent { color: var(--gold); font-weight: 700; }
  .kpi-label {
    margin-top: 8px;
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--muted);
  }
  /* Performance section uses bigger KPIs */
  .perf-kpis .kpi-value { font-size: clamp(28px, 3.2vw, 38px); color: var(--gold); font-weight: 700; }

  /* SECTIONS */
  section.block { padding: 110px 0; }
  .section-head { text-align: center; margin-bottom: 56px; }
  .section-head h2 {
    font-size: clamp(28px, 3.6vw, 44px);
    font-weight: 700;
    margin-top: 18px;
    line-height: 1.2;
    max-width: 820px;

  }
  .section-head p {
    color: var(--muted); margin-top: 18px; max-width: 640px;
    margin-left: auto; margin-right: auto;
  }

  /* MANIFIESTO (intermediate section) */
  .manifesto {
    background: var(--bg-soft);
    padding: 130px 0;
    position: relative;
    overflow: hidden;
  }
  .manifesto::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(50% 60% at 80% 50%, rgba(203,160,82,0.06), transparent 70%);
    pointer-events: none;
  }
  .manifesto-inner {
    max-width: 980px; margin: 0 auto; padding: 0 32px;
    position: relative;
  }
  .manifesto h2 {
    font-size: clamp(30px, 4vw, 56px);
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -0.015em;
    max-width: 880px;
  }
  .manifesto h2 .gold { color: var(--gold); }
  .manifesto .divider-line {
    width: 64px; height: 2px;
    background: var(--gold);
    margin: 40px 0 32px;
  }
  .manifesto p {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.7;
    max-width: 640px;
  }

  /* PHILOSOPHY CARDS */
  .three-cols {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .pcard {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px 28px;
  }
  .pcard-icon {
    width: 36px; height: 36px;
    margin-bottom: 22px;
    color: var(--gold);
  }
  .pcard-icon svg { width: 100%; height: 100%; display: block; }
  .pcard-num {
    font-size: 11px; color: var(--gold); letter-spacing: 0.22em;
    margin-bottom: 14px;

  .pcard h3 { font-size: 19px; margin-bottom: 12px; }
  .pcard p { color: var(--muted); font-size: 14px; line-height: 1.65; }

  /* PERFORMANCE */
  .perf-kpis {
    display:grid; grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 36px 28px;
    margin-bottom: 28px;
  }
  .chart-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
  }
  .chart-head {
    display:flex; align-items:flex-start; justify-content:space-between;
    flex-wrap: wrap; gap: 16px;
    margin-bottom: 12px;
  }
  .chart-head .left small {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
  }
  .chart-head .left p { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .chart-head .right { text-align: right; }
  .chart-head .right small {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
  }
  .chart-head .right .equity {
    font-size: 28px; font-weight: 700; margin-top: 4px;
  }
  .chart-head .right .equity em { font-style: normal; color: var(--gold); font-size: 14px; margin-left: 8px; }

  .year-tabs { display:flex; gap: 8px; margin-bottom: 18px; }
  .year-tab {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 999px;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;

  .year-tab.active { background: var(--gold); color: #1a1a1a; border-color: var(--gold); }

  .chart-axis {
    display:flex; justify-content:space-between;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
    margin-top: 10px;

    margin-top: 22px; font-style: italic;
    text-align: center;
    max-width: 680px; margin-left: auto; margin-right: auto;
  }

  /* TIMELINE */
  .timeline {
    position: relative;
    max-width: 840px;
    margin: 0 auto;
  }
  .timeline::before {
    content: "";
    position: absolute; top: 12px; bottom: 12px;
    left: 50%; width: 1px;
    background: var(--line);
  }
  .step {
    display: grid;
    grid-template-columns: 1fr 56px 1fr;
    align-items: start;
    gap: 24px;
    margin-bottom: 60px;
  }
  .step:last-child { margin-bottom: 0; }
  .step-dot {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size: 11px; color: var(--gold); letter-spacing: 0.1em;
    background: var(--bg);
    margin: 0 auto;
  }
  .step h3 { font-size: 20px; margin-bottom: 8px; }
  .step p { color: var(--muted); font-size: 14px; line-height: 1.65; }
  .step.right .left-col { visibility: hidden; }
  .step.right .right-col { text-align: left; }
  .step.left .right-col { visibility: hidden; }
  .step.left .left-col { text-align: right; }

  .two-cols {
    display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center;
  }

  .two-cols p.lead { color: var(--muted); margin-top: 22px; max-width: 460px; }
  .check-list {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 22px;
  }
  .check-item {
    display:flex; align-items:center; gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .check-item:last-child { border-bottom: 0; }
  .check-icon {
    flex: 0 0 22px; height: 22px; border-radius: 50%;
    border: 1px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    color: var(--gold); font-size: 11px;

  /* ABOUT */
  .about-text { max-width: 760px; margin: 0 auto; text-align: center; color: var(--muted); }
  .about-text strong { color: var(--text); font-weight: 600; }

  /* TRAYECTORIA — founder block + timeline */

    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 56px;
    align-items: center;
    margin-top: 24px;

  .founder-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0;

  .founder-photo {

    background: #0e0e0e;
    border-bottom: 1px solid var(--line);

  .founder-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .founder-role { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
  .founder-bio { color: var(--muted); font-size: 14px; line-height: 1.65; }

  .timeline-cards {

  .tline {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 28px;
    align-items: center;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold);

  /* FORM */

  .form-row { margin-bottom: 18px; }
  .form-row label {

  .form-row input,
  .form-row select,
  .form-row textarea {

    background: rgba(0,0,0,0.35);
    border: 1px solid var(--line);

    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
  }
  .form-row textarea { min-height: 110px; resize: vertical; }
  .form-row input:focus,
  .form-row select:focus,
  .form-row textarea:focus {
    outline: none; border-color: var(--gold);
  }
  .form-help { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .form-submit { width: 100%; padding: 14px; font-size: 12px; }
  .form-disclaimer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 16px; }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--line);
    padding: 72px 0 40px;
  }
  .footer-grid {
    display:grid; grid-template-columns: 1.2fr 1fr 1fr 1.4fr; gap: 48px;
  }
  .footer-grid h4 {
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 16px; font-weight: 600;
  }
  .footer-brand { font-size: 16px; font-weight: 700; letter-spacing: 0.04em; }
  .footer-tag { color: var(--muted); margin-top: 10px; font-size: 14px; line-height: 1.6; }
  .footer-grid p, .footer-grid a { color: var(--muted); font-size: 13px; line-height: 1.85; }
  .footer-grid a:hover { color: var(--gold); }
  .footer-phone {
    display:block;
    font-size: 22px; font-weight: 700; color: var(--gold) !important;
    letter-spacing: 0.01em;
    margin-bottom: 8px;
  }
  .footer-social { display: flex; gap: 14px; margin-top: 4px; }
  .footer-social a {
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--muted) !important;
    transition: all .2s;
  }
  .footer-social a:hover { border-color: var(--gold); color: var(--gold) !important; }
  .footer-social svg { width: 16px; height: 16px; }
  .footer-bottom {
    margin-top: 56px;
    border-top: 1px solid var(--line);
    padding-top: 24px;
    display:flex; justify-content:space-between;
    color: var(--muted); font-size: 12px;

  /* RESPONSIVE */
  @media (max-width: 880px) {
    .nav { display: none; }
    .three-cols, .perf-kpis, .footer-grid, .two-cols, .kpi-row { grid-template-columns: 1fr; }
    .step { grid-template-columns: 36px 1fr; }
    .timeline::before { left: 18px; }
    .step .left-col { display: none; }
    .step .right-col { text-align: left !important; }
    .step.left .right-col, .step.right .right-col { visibility: visible; }
    .trayectoria-grid { grid-template-columns: 1fr; gap: 32px; }
    .tline { grid-template-columns: 80px 1fr; gap: 18px; padding: 18px 22px; }
    .tline-year { font-size: 26px; }
  }

  /* error pane */
  #error { color:#ff6b6b; padding:20px; font-family:monospace; white-space:pre-wrap; }
</style>

function getEquityCurve(arr) {
    let eq = 100;
    const out = [eq];
    arr.forEach(r => { eq *= (1 + r/100); out.push(eq); });
    return out;
}

// Convert a monthly curve into smoothed daily points for a "live" feel.
function getDailyCurve(monthlyReturns) {
    const pts = [100];
    let eq = 100;
    monthlyReturns.forEach(r => {
        const target = eq * (1 + r/100);
        const days = 21; // trading days per month
        for (let d = 1; d <= days; d++) {
            const base = eq + (target - eq) * (d / days);
            const noise = (Math.sin(d * 1.7 + pts.length) + Math.cos(d * 0.9)) * Math.abs(target - eq) * 0.07;
            pts.push(Math.max(base + noise, eq * 0.95));
        }
        eq = target;
    });
    return pts;
}

function Performance() {
    const [year, setYear] = React.useState("2025");
    const returns = yearlyReturns[year];
    // Trim trailing zero months (e.g. 2026 only has 2 months of data)
    const activeReturns = year === "2026" ? returns.slice(0, 2) : returns;
    const dailyCurve = getDailyCurve(activeReturns);
    const monthlyCurve = getEquityCurve(activeReturns);

    const yearReturn = ((monthlyCurve[monthlyCurve.length - 1] - 100)).toFixed(2);

    // Build polyline path for daily equity curve
    const W = 760, H = 260, padX = 40, padY = 24;
    const minEq = Math.min.apply(null, dailyCurve);
    const maxEq = Math.max.apply(null, dailyCurve);
    const range = (maxEq - minEq) || 1;
    const points = dailyCurve.map((v, i) => {
        const x = padX + (i / (dailyCurve.length - 1)) * (W - padX*2);
        const y = (H - padY) - ((v - minEq) / range) * (H - padY*2);
        return x.toFixed(2) + "," + y.toFixed(2);
    }).join(" ");

    return (
        <section className="block" id="performance" style={{borderTop: "1px solid var(--line)"}}>
            <div className="container">
                <div className="section-head">
                    <div className="eyebrow">Performance</div>
                    <div className="divider" />
                    <h2>5 años de track record. Transparente y verificable.</h2>
                    <p>Te mostramos el proceso, no resultados curados de años pasados. Las métricas se calculan sobre operaciones reales en cuentas no custodial.</p>
                </div>

                <div className="perf-kpis">
                    <div className="kpi">
                        <div className="kpi-value">+{TRACK.annualAvg}%</div>
                        <div className="kpi-label">ROI Promedio<br/>Bruto Anual</div>
                    </div>
                    <div className="kpi">
                        <div className="kpi-value">+{TRACK.cumulativeFiveYears.toFixed(0)}%</div>
                        <div className="kpi-label">Acumulado bruto 5 años</div>
                    </div>
                    <div className="kpi">
                        <div className="kpi-value">{TRACK.years} años</div>
                        <div className="kpi-label">Operando desde {TRACK.foundedYear}</div>
                    </div>
                </div>

                <div className="chart-card">
                    <div className="chart-head">
                        <div className="left">
                            <small>Curva de equity — Año {year}</small>
                            <p>Asignación hipotética de $10,000 en enero del año seleccionado.</p>
                        </div>
                        <div className="right">
                            <small>Equity actual</small>
                            <div className="equity">${(monthlyCurve[monthlyCurve.length - 1] * 100).toLocaleString("en-US", {maximumFractionDigits: 0})} <em>+{yearReturn}%</em></div>
                        </div>
                    </div>

                    <div className="year-tabs">
                        {["2024","2025","2026"].map(y => (
                            <button key={y}
                                    className={"year-tab" + (year === y ? " active" : "")}
                                    onClick={() => setYear(y)}>
                                {y}
                            </button>
                        ))}
                    </div>

                    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%", height:"auto"}}>
                        <defs>
                            <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#CBA052" stopOpacity="0.32"/>
                                <stop offset="100%" stopColor="#CBA052" stopOpacity="0"/>
                            </linearGradient>
                        </defs>
                        {/* Area under curve */}
                        <polygon
                            fill="url(#goldGrad)"
                            points={points + ` ${padX + (W - padX*2)},${H - padY} ${padX},${H - padY}`}
                        />
                        {/* Daily-tick curve */}
                        <polyline
                            fill="none"
                            stroke="#CBA052"
                            strokeWidth="1.6"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            points={points}
                        />
                        {/* Final point marker */}
                        {(() => {
                            const i = dailyCurve.length - 1;
                            const x = padX + (W - padX*2);
                            const y = (H - padY) - ((dailyCurve[i] - minEq) / range) * (H - padY*2);
                            return <circle cx={x} cy={y} r="3.5" fill="#CBA052" />;
                        })()}
                    </svg>

                    <div className="chart-axis">
                        <span>Inicio del año</span>
                        <span>Hoy</span>
                    </div>

                    <p className="chart-foot">
                        El track record se actualiza mensualmente. Rendimientos pasados no garantizan resultados futuros. Los datos mostrados corresponden a operaciones reales en cuentas no custodial.
                    </p>
                </div>
            </div>
        </section>
    );
}
